<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>リモートPC電源スイッチ</title>
  <style>
    :root {
      --bg-color: #f8fafc;
      --card-bg: #ffffff;
      --text-main: #334155;
      --text-muted: #64748b;
      --primary-color: #3b82f6;
      --primary-hover: #2563eb;
      --border-color: #e2e8f0;
      --radius: 12px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 16px;
    }

    .card {
      background: var(--card-bg);
      padding: 28px 24px;
      border-radius: var(--radius);
      border: 1px solid var(--border-color);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
      width: 100%;
      max-width: 360px;
      text-align: center;
    }

    h1 {
      font-size: 1.1rem;
      font-weight: 600;
      margin-top: 0;
      margin-bottom: 24px;
      color: var(--text-main);
      letter-spacing: -0.01em;
    }

    .power-btn {
      background-color: var(--primary-color);
      color: #ffffff;
      border: none;
      border-radius: var(--radius);
      padding: 14px 20px;
      font-size: 0.95rem;
      font-weight: 500;
      width: 100%;
      cursor: pointer;
      transition: background-color 0.15s ease, transform 0.05s ease;
    }

    .power-btn:hover {
      background-color: var(--primary-hover);
    }

    .power-btn:active {
      transform: scale(0.99);
    }

    .status-msg {
      margin-top: 14px;
      font-size: 0.85rem;
      min-height: 1.2em;
    }

    .info-box {
      margin-top: 20px;
      padding-top: 16px;
      border-top: 1px solid var(--border-color);
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .last-executed {
      font-weight: 500;
      color: var(--text-main);
      margin-top: 4px;
    }

    .nav-link {
      display: inline-block;
      margin-top: 16px;
      padding-top: 12px;
      font-size: 0.85rem;
      color: #3b82f6;
      text-decoration: none;
      transition: opacity 0.15s ease;
    }

    .nav-link:hover {
      opacity: 0.8;
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>PC Remote Power Switch</h1>
    
    <button class="power-btn" onclick="confirmAndPowerOn()">PCをオンにする</button>
    
    <div id="status" class="status-msg"></div>

    <div class="info-box">
      <div>最終実行日時</div>
      <div id="last-executed" class="last-executed">未実行</div>
    </div>

    <a href="https://remotedesktop.google.com/access" target="_blank" rel="noopener noreferrer" class="nav-link">
      Chrome リモート デスクトップを開く &rarr;
    </a>
  </div>

  <script>
    const IFTTT_URL = "https://maker.ifttt.com/trigger/pc-on/json/with/key/MgiXPyJ8nSsN41G2wBZyw";
    const STORAGE_KEY = "pc_on_last_executed";

    window.addEventListener('DOMContentLoaded', () => {
      const savedDate = localStorage.getItem(STORAGE_KEY);
      if (savedDate) {
        document.getElementById('last-executed').textContent = savedDate;
      }
    });

    function confirmAndPowerOn() {
      const isConfirmed = confirm("本当にPCの電源をオンにしますか？");
      if (!isConfirmed) return;

      const statusEl = document.getElementById('status');
      statusEl.style.color = '#3b82f6';
      statusEl.textContent = "送信中...";

      fetch(IFTTT_URL, {
        method: 'POST',
        mode: 'no-cors'
      })
      .then(() => {
        const now = new Date();
        const formattedDate = now.getFullYear() + '/' +
          String(now.getMonth() + 1).padStart(2, '0') + '/' +
          String(now.getDate()).padStart(2, '0') + ' ' +
          String(now.getHours()).padStart(2, '0') + ':' +
          String(now.getMinutes()).padStart(2, '0') + ':' +
          String(now.getSeconds()).padStart(2, '0');

        localStorage.setItem(STORAGE_KEY, formattedDate);
        document.getElementById('last-executed').textContent = formattedDate;

        statusEl.style.color = '#10b981';
        statusEl.textContent = "送信要求を完了しました";
      })
      .catch(error => {
        console.error('Error:', error);
        statusEl.style.color = '#ef4444';
        statusEl.textContent = "送信エラーが発生しました";
      });
    }
  </script>

</body>
</html>
