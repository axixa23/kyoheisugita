<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>リモートPC電源スイッチ</title>
  <style>
    :root {
      --bg-color: #f4f6f8;
      --card-bg: #ffffff;
      --text-color: #333333;
      --primary-color: #007bff;
      --primary-hover: #0056b3;
      --sub-color: #6c757d;
      --border-radius: 12px;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 16px;
    }

    .card {
      background: var(--card-bg);
      padding: 28px;
      border-radius: var(--border-radius);
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
      width: 100%;
      max-width: 360px;
      text-align: center;
    }

    h1 {
      font-size: 1.25rem;
      margin-top: 0;
      margin-bottom: 20px;
    }

    .power-btn {
      background-color: var(--primary-color);
      color: white;
      border: none;
      border-radius: var(--border-radius);
      padding: 16px 24px;
      font-size: 1.1rem;
      font-weight: bold;
      width: 100%;
      cursor: pointer;
      transition: background-color 0.2s, transform 0.1s;
    }

    .power-btn:hover {
      background-color: var(--primary-hover);
    }

    .power-btn:active {
      transform: scale(0.98);
    }

    .info-box {
      margin-top: 24px;
      padding-top: 16px;
      border-top: 1px solid #eeeeee;
      font-size: 0.9rem;
      color: var(--sub-color);
    }

    .last-executed {
      font-weight: bold;
      color: #333333;
      margin-top: 4px;
      word-break: break-all;
    }

    .status-msg {
      margin-top: 12px;
      font-size: 0.85rem;
      min-height: 1.2em;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>PC Remote Power Switch</h1>
    
    <button class="power-btn" onclick="confirmAndPowerOn()">PCをオンにする</button>
    
    <div id="status" class="status-msg"></div>

    <div class="info-box">
      <div>最終実行日時</div>
      <div id="last-executed" class="last-executed">未実行</div>
    </div>
  </div>

  <script>
    // IFTTT Webhook URL
    const IFTTT_URL = "https://maker.ifttt.com/trigger/pc-on/json/with/key/MgiXPyJ8nSsN41G2wBZyw";
    const STORAGE_KEY = "pc_on_last_executed";

    // 画面読み込み時に保存された最終実行日時を表示
    window.addEventListener('DOMContentLoaded', () => {
      const savedDate = localStorage.getItem(STORAGE_KEY);
      if (savedDate) {
        document.getElementById('last-executed').textContent = savedDate;
      }
    });

    // 確認ダイアログを出してからリクエストを送信する関数
    function confirmAndPowerOn() {
      const isConfirmed = confirm("本当にPCの電源をオンにしますか？");
      if (!isConfirmed) return;

      const statusEl = document.getElementById('status');
      statusEl.style.color = '#007bff';
      statusEl.textContent = "送信中...";

      // mode: 'no-cors' により、IFTTTのCORSエラー（ブラウザの制限）を回避して送信します
      fetch(IFTTT_URL, {
        method: 'POST',
        mode: 'no-cors'
      })
      .then(() => {
        // 現在日時を取得してフォーマット (YYYY/MM/DD HH:mm:ss)
        const now = new Date();
        const formattedDate = now.getFullYear() + '/' +
          String(now.getMonth() + 1).padStart(2, '0') + '/' +
          String(now.getDate()).padStart(2, '0') + ' ' +
          String(now.getHours()).padStart(2, '0') + ':' +
          String(now.getMinutes()).padStart(2, '0') + ':' +
          String(now.getSeconds()).padStart(2, '0');

        // ローカルストレージに保存＆画面更新
        localStorage.setItem(STORAGE_KEY, formattedDate);
        document.getElementById('last-executed').textContent = formattedDate;

        statusEl.style.color = '#28a745';
        statusEl.textContent = "送信要求を完了しました";
      })
      .catch(error => {
        console.error('Error:', error);
        statusEl.style.color = '#dc3545';
        statusEl.textContent = "送信エラーが発生しました";
      });
    }
  </script>

</body>
</html>
