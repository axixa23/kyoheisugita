/* ===== 演出 ===== */
function cellEl(c,r){return document.querySelector(`.cell[data-c="${c}"][data-r="${r}"]`);}
function cellCenter(c,r){const e=cellEl(c,r);if(!e)return null;const b=e.getBoundingClientRect();return [b.left+b.width/2,b.top+b.height/2];}
function slideIn(x,y,from,dur){
  if(RM||!from) return; const e=cellEl(x,y), pz=e&&e.querySelector('.pz'), to=cellCenter(x,y); if(!pz||!to) return;
  anim(pz,[{transform:`translate(${from[0]-to[0]}px,${from[1]-to[1]}px) scale(1.1)`},{transform:'translate(0,0) scale(1)'}],{duration:dur,easing:'cubic-bezier(.3,.7,.2,1)'});
}
// 曲がりながら進む（矢印・貫通）。通ったマスを順にたどる
async function slidePath(x,y,pts,sp){
  const e=cellEl(x,y), pz=e&&e.querySelector('.pz'), to=cellCenter(x,y); if(!pz||!to||RM) return;
  const frames=pts.map(([px,py])=>{const c=cellCenter(px,py)||to; return {transform:`translate(${c[0]-to[0]}px,${c[1]-to[1]}px)`};});
  const dur=Math.max(160,Math.min(900,pts.length*70*sp));
  anim(pz,frames,{duration:dur,easing:'linear'}); for(let i=1;i<pts.length;i++) setTimeout(()=>tok(0),dur*i/pts.length);
  await sleep(dur);
}
function shake(power){
  if(RM) return; const amp=Math.min(2+power*1.2,16);
  anim($("#frame"),[{transform:'translate(0,0)'},{transform:`translate(${-amp}px,${amp*.5}px)`},{transform:`translate(${amp*.8}px,${-amp*.6}px)`},{transform:`translate(${-amp*.4}px,${amp*.3}px)`},{transform:'translate(0,0)'}],{duration:120+power*14,easing:'ease-out'});
}
function impact(c,r,power,big){ bachin(big?Math.max(power,10):power); chips(c,r,big?24:6+power*2); setTimeout(()=>shake(big?12:power),big?0:30+Math.min(power,8)*6); }
function chips(c,r,n){
  if(RM) return; const pt=cellCenter(c,r); if(!pt) return;
  for(let i=0;i<n;i++){
    const d=document.createElement('span'); d.className='chip';
    d.style.left=pt[0]+'px'; d.style.top=pt[1]+'px'; $('#fx').appendChild(d);
    const a=Math.random()*Math.PI*2, v=30+Math.random()*(n>20?140:70);
    anim(d,[{transform:'translate(0,0) rotate(0deg)',opacity:1},{transform:`translate(${Math.cos(a)*v}px,${Math.sin(a)*v+30}px) rotate(${rand(540)}deg)`,opacity:0}],{duration:450+rand(300),easing:'cubic-bezier(.2,.7,.4,1)'},true);
  }
}
function floatText(c,r,text,cls,row=0){
  const pt=cellCenter(c,r); if(!pt) return;
  const d=document.createElement('span'); d.className='ft '+cls; d.textContent=text;
  d.style.left=pt[0]+'px'; d.style.top=(pt[1]-10+row*24)+'px'; $('#fx').appendChild(d);
  anim(d,[{transform:'translate(-50%,-50%) scale(1.3)',opacity:1},{transform:'translate(-50%,-60%) scale(1)',opacity:1,offset:.3},{transform:'translate(-50%,-170%)',opacity:0}],{duration:RM?700:1000,easing:'ease-out'},true);
}
// 加点になる動きをしたときの判子
function stampAt(x,y,text){
  const d=document.createElement('div'); d.className='stamp'; d.textContent=text;
  d.style.left=Math.min(Math.max(x,80),innerWidth-80)+'px'; d.style.top=Math.max(y,60)+'px'; $('#fx').appendChild(d);
  const rot=(Math.random()*10-12).toFixed(1);
  anim(d,RM?[{transform:'translate(-50%,-50%)',opacity:1},{transform:'translate(-50%,-50%)',opacity:0}]:[
    {transform:`translate(-50%,-50%) rotate(${rot}deg) scale(2.6)`,opacity:0},
    {transform:`translate(-50%,-50%) rotate(${rot}deg) scale(1)`,opacity:1,offset:.12},
    {transform:`translate(-50%,-50%) rotate(${rot}deg) scale(1.04)`,opacity:1,offset:.7},
    {transform:`translate(-50%,-80%) rotate(${rot}deg) scale(1)`,opacity:0}],{duration:1150,easing:'ease-out'},true);
  stampSnd();
}
function stamp(c,r,text,row=0){const pt=cellCenter(c,r); if(pt) stampAt(pt[0],pt[1]-34-row*52,text);}
function bigStamp(text){const b=$('#frame').getBoundingClientRect(); stampAt(b.left+b.width/2,b.top+b.height/2,text);}
function flash(){if(RM)return;anim($("#flash"),[{opacity:.7},{opacity:0}],{duration:320,easing:'ease-out'});}
function bigText(t,dur=1000){
  const d=document.createElement('div'); d.className='big'; d.textContent=t; $('#fx').appendChild(d);
  anim(d,RM?[{opacity:1},{opacity:0}]:[{transform:'translate(-50%,-50%) scale(2)',opacity:0},{transform:'translate(-50%,-50%) scale(1)',opacity:1,offset:.18},{transform:'translate(-50%,-50%) scale(1)',opacity:1,offset:.75},{transform:'translate(-50%,-50%) scale(1.05)',opacity:0}],{duration:dur,easing:'ease-out'},true);
}

/* ===== 音 ===== */
let AC=null, MASTER=null;
function ensureAudio(){
  if(!AC){try{
    AC=new (window.AudioContext||window.webkitAudioContext)();
    const comp=AC.createDynamicsCompressor(); comp.threshold.value=-8; comp.ratio.value=4;
    MASTER=AC.createGain(); MASTER.gain.value=.9; MASTER.connect(comp); comp.connect(AC.destination);
  }catch(e){AC=null;}}
  if(AC&&AC.state==='suspended') AC.resume();
}
function noise(dur,curve=4){
  const b=AC.createBuffer(1,Math.floor(AC.sampleRate*dur),AC.sampleRate), d=b.getChannelData(0);
  for(let i=0;i<d.length;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,curve);
  const s=AC.createBufferSource(); s.buffer=b; return s;
}
function bachin(power){
  if(muted||!AC) return;
  const t=AC.currentTime, p=Math.min(power,14);
  const n=noise(.1), bp=AC.createBiquadFilter(), g=AC.createGain();
  bp.type='bandpass'; bp.frequency.value=2600-p*110; bp.Q.value=.9; g.gain.value=Math.min(.45+p*.1,1.4);
  n.connect(bp); bp.connect(g); g.connect(MASTER); n.start(t);
  const o=AC.createOscillator(), og=AC.createGain();
  o.type='triangle'; o.frequency.setValueAtTime(1000-p*40,t); o.frequency.exponentialRampToValueAtTime(320,t+.06);
  og.gain.setValueAtTime(.32,t); og.gain.exponentialRampToValueAtTime(.001,t+.09);
  o.connect(og); og.connect(MASTER); o.start(t); o.stop(t+.12);
  const th=AC.createOscillator(), tg=AC.createGain();
  th.type='sine'; th.frequency.setValueAtTime(170,t); th.frequency.exponentialRampToValueAtTime(42,t+.18+p*.02);
  tg.gain.setValueAtTime(Math.min(.08+p*.09,1.2),t); tg.gain.exponentialRampToValueAtTime(.001,t+.22+p*.035);
  th.connect(tg); tg.connect(MASTER); th.start(t); th.stop(t+.8);
}
function chime(i){
  if(muted||!AC) return;
  const t=AC.currentTime+.01, f=440*Math.pow(2,Math.min(i,24)/12);
  for(const [mul,gain] of [[1,.16],[2,.06]]){
    const o=AC.createOscillator(), g=AC.createGain();
    o.type='sine'; o.frequency.value=f*mul;
    g.gain.setValueAtTime(gain,t); g.gain.exponentialRampToValueAtTime(.001,t+.35);
    o.connect(g); g.connect(MASTER); o.start(t); o.stop(t+.4);
  }
}
// 判子を押す音：低く重い「ドン」
function stampSnd(){
  if(muted||!AC) return;
  const t=AC.currentTime, o=AC.createOscillator(), g=AC.createGain();
  o.type='sine'; o.frequency.setValueAtTime(110,t); o.frequency.exponentialRampToValueAtTime(48,t+.22);
  g.gain.setValueAtTime(.9,t); g.gain.exponentialRampToValueAtTime(.001,t+.3);
  o.connect(g); g.connect(MASTER); o.start(t); o.stop(t+.35);
  const n=noise(.06,3), lp=AC.createBiquadFilter(), ng=AC.createGain();
  lp.type='lowpass'; lp.frequency.value=900; ng.gain.value=.5;
  n.connect(lp); lp.connect(ng); ng.connect(MASTER); n.start(t);
}
function tok(level){
  if(muted||!AC) return;
  const t=AC.currentTime, n=noise(.05,6), bp=AC.createBiquadFilter(), g=AC.createGain();
  bp.type='bandpass'; bp.frequency.value=3200-level*400; bp.Q.value=1.4; g.gain.value=.3;
  n.connect(bp); bp.connect(g); g.connect(MASTER); n.start(t);
}

function anim(el,kf,opt,rm){ if(!el) return; if(el.animate){const a=el.animate(kf,opt); if(rm) a.onfinish=()=>el.remove();} else if(rm) setTimeout(()=>el.remove(),opt.duration||500); }

function closeModal(){$('#modal').hidden=true;}

    <li><b>壁</b>：石垣は爆弾で壊せる。第二幕からの鉄扉は、跳ぶ動きか技「跳躍」でしか越えられない（爆弾でも壊れない）。</li>

    <li><b>体力${HP0}</b>：0でもまだ戦える。0から斬られると倒れる。</li>
    <li>突破すると戦利品。茶屋でお金を使い、次の陣へ。お金は貯めると利子が付く（5金ごとに+1）。</li>
    <li class="credit">着想：Pawnbarian、天誅シリーズ。</li></ul>
    <button class="btn pri" id="mClose" type="button" style="width:100%">${first?'はじめる':'閉じる'}</button>`);
  $('#mClose').onclick=()=>{closeModal();ensureAudio();};

function showYaku(){
  openModal(`<h2>役</h2><p>手番を終えたとき、成立した役を全部足す。</p><div class="rows ylist">${YORDER.map(k=>{const [c,m]=yv(k); return `<div class="row"><span>${YAKU[k].name} Lv${S.levels[k]}<small>${YAKU[k].desc}</small></span><span>${c}×${m}</span></div>`;}).join('')}</div>
    <p>さらに、取った駒1枚ごとに価値×${CHIP_PER_V}のチップが入る。</p>
    <button class="btn pri" id="mClose" type="button" style="width:100%">閉じる</button>`);

}
